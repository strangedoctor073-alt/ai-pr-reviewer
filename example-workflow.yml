# Copy to .github/workflows/ai-pr-review.yml in the repository you want reviewed.
name: "AI PR Reviewer"

on:
  # Keep `pull_request`. Do NOT switch to `pull_request_target`: it runs with
  # repository secrets against code from untrusted forks.
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      # Check out the PR BASE, not the merge commit, so .ai-pr-reviewer.yml is
      # trusted repository-owner policy and a PR cannot rewrite its own rules.
      # (The diff itself is fetched through the GitHub API, not from disk.)
      - name: Checkout base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Run AI PR Reviewer
        uses: strangedoctor073-alt/ai-pr-reviewer@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Claude (default model: claude-sonnet-4-6). Leave the secret unset to
          # use the free static-rules fallback (deterministic, NOT AI).
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Fork PRs get no secrets and a read-only token: run static rules and
          # skip posting instead of failing.
          no_comment: ${{ github.event.pull_request.head.repo.fork }}
          # Optional dashboard (see README):
          # dashboard_url: ${{ secrets.PR_DASHBOARD_URL }}
          # dashboard_token: ${{ secrets.PR_DASHBOARD_TOKEN }}

      - name: Upload review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-report
          path: review-report.json
          if-no-files-found: ignore

      # ---- Other providers: `model` is REQUIRED (there is no default) --------
